<!DOCTYPE html>
<html lang="es-CO">
<head>
  <meta charset="UTF-8">
  <title>Blog | Asesoría CT</title>
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon.png">
  <link rel="shortcut icon" href="/favicon.png">
  <script>
    // Redirige al sistema central de blog preservando el slug
    const pathParts = window.location.pathname.split('/').filter(Boolean);
    const slug = pathParts[pathParts.length - 1].replace(/\.html$/, '');
    if (slug && slug !== 'blog' && slug !== 'index') {
      window.location.replace('../blog.html?slug=' + encodeURIComponent(slug));
    } else {
      window.location.replace('../blog.html');
    }
  </script>
</head>
<body>
  <p>Redirigiendo al artículo...</p>
</body>
</html>
