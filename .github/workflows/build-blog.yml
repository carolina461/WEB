name: Build Blog y Sitemap

on:
  push:
    paths:
      - 'content/blog/**'
      - '.pages.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Regenerar blog-data.js, blog-engine.js, blog-index.json y sitemap.xml
        run: node scripts/build-blog.js

      - name: Commit y push si hubo cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add js/blog-data.js js/blog-engine.js content/blog-index.json sitemap.xml
          git diff --quiet && git diff --staged --quiet || \
            git commit -m "🤖 Auto-build blog: actualizar índice y sitemap [skip ci]" && \
            git push
