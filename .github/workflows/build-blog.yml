name: Build Blog y Sitemap

on:
  push:
    paths:
      - 'content/blog/**'
      - '.pages.yml'
  workflow_dispatch:

concurrency:
  group: blog-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Regenerar blog-data.js, blog-engine.js, blog-index.json y sitemap.xml
        run: node scripts/build-blog.js

      - name: Commit y push si hubo cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add js/blog-data.js js/blog-engine.js content/blog-index.json sitemap.xml
          
          if git diff --staged --quiet; then
            echo "No hay cambios staged para commitear."
            exit 0
          fi

          git commit -m "🤖 Auto-build blog: actualizar índice y sitemap [skip ci]"

          # Reintentos con rebase para evitar rechazos por pushes concurrentes (ej. Pages CMS)
          max_retries=3
          count=0
          pushed=false

          while [ $count -lt $max_retries ]; do
            count=$((count + 1))
            echo "Intento de push $count de $max_retries..."

            if git push origin main; then
              pushed=true
              echo "Push completado exitosamente."
              break
            else
              echo "Push falló. Intentando pull con rebase..."
              if ! git pull --rebase origin main; then
                echo "Conflicto en rebase detectado. Resolviendo conflictos priorizando archivos generados..."
                git checkout --theirs .
                git add -A
                GIT_EDITOR=true git rebase --continue || git rebase --skip || true
              fi
            fi
          done

          if [ "$pushed" = false ]; then
            echo "Error: No se pudo hacer push a main tras $max_retries intentos."
            exit 1
          fi
