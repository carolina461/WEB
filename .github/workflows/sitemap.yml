name: Generar Sitemap Automatico

on:
  push:
    paths:
      - 'content/blog/**'
      - '.pages.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Generar sitemap.xml
        shell: pwsh
        run: |
          ./generate-sitemap.ps1

      - name: Commit y push si hubo cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-actualizar sitemap.xml con nuevos articulos [skip ci]" && git push)
