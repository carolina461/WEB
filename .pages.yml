content:
  - name: blog
    label: "Blog y Actualidad"
    type: collection
    path: content/blog
    format: yaml-frontmatter
    filename: "{slug}.md"
    view:
      primary: title
      fields: [title, category, date, slug]
      sort: date
      order: desc
    fields:
      - name: title
        label: "Título del Artículo"
        type: string
        required: true

      - name: slug
        label: "Slug (URL amigable)"
        type: string
        required: true

      - name: date
        label: "Fecha de Publicación"
        type: date
        required: true

      - name: category
        label: "Categoría"
        type: select
        required: true
        options:
          values:
            - "DIAN"
            - "Impuestos"
            - "Nómina y Laboral"
            - "Finanzas"

      - name: summary
        label: "Resumen Corto (Máx. 140 caracteres)"
        type: text
        required: true

      - name: body
        label: "Contenido del Artículo"
        type: rich-text
        required: true